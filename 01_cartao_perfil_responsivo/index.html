<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 01 - Cartão de Perfil Responsivo | Front-End</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <article class="profile-card"> 

            <!-- Botão de alternar tema Dark/Light -->
            <button id="theme-toggle" class="theme-button" aria-label="Alternar tema">
                🌙
            </button>

            <header class="profile-header">
                <img src="https://cdn-icons-png.flaticon.com/512/6840/6840478.png" alt="Avatar de Desenvolvedor" class="profile-image">
                <h1 class="profile-name">Elder Gomes</h1>
                <p class="profile-title">Desenvolvedor Front-End & Análise de Dados</p>
            </header>

            <section class="profile-bio">
                <p>Estudante de Desenvolvimento Web, construindo soluções modernas com HTML5, CSS3 e JavaScript ES6+.</p>
            </section>

            <section class="profile-links">
                <a href="https://github.com/eldergomes-dev" target="_blank" rel="noopener noreferrer" class="link-button">GitHub</a>
                <a href="https://www.linkedin.com/in/elder-gomes-da-silva-santos-ab7558367/" target="_blank" rel="noopener noreferrer" class="link-button">LinkedIn</a>
                <a href="mailto:gomesdasilvasantoselder7@gmail.com" class="link-button">Contato</a>
            </section>

            <footer class="profile-footer">
                <small>Projeto 01 - Trilha Front-End</small>
            </footer>

        </article>

    </main>

    <!-- Conexão com a lógica em JS -->
    <script src="script.js" defer></script>
    
</body>
</html>
